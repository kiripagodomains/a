<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>地震シミュレーター【かさまし版】</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.05s;
        }
        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 100, 100, 0.8);
            letter-spacing: 2px;
        }
        .subtitle {
            color: #ff6b6b;
            font-size: 1rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        .meter {
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            border: 2px solid rgba(255,255,255,0.1);
        }
        .intensity-label {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 8px;
        }
        .intensity-value {
            font-size: 3.5rem;
            font-weight: bold;
            color: #ff4757;
            text-shadow: 0 0 30px rgba(255, 71, 87, 0.9);
            transition: all 0.2s;
        }
        .intensity-name {
            font-size: 1.4rem;
            margin-top: 5px;
            color: #ff9f43;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        button {
            padding: 16px 24px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        .btn-start {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            box-shadow: 0 8px 25px rgba(238, 90, 36, 0.4);
        }
        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(238, 90, 36, 0.6);
        }
        .btn-start:active {
            transform: scale(0.98);
        }
        .btn-stop {
            background: linear-gradient(135deg, #54a0ff, #2e86de);
            color: white;
            box-shadow: 0 8px 25px rgba(46, 134, 222, 0.4);
        }
        .btn-stop:hover {
            transform: scale(1.05);
        }
        .presets {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .preset-btn {
            padding: 12px;
            font-size: 0.95rem;
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
        }
        .preset-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        .preset-btn.active {
            background: rgba(255, 107, 107, 0.3);
            border-color: #ff6b6b;
        }
        .info {
            font-size: 0.85rem;
            color: #aaa;
            line-height: 1.5;
            margin-top: 15px;
        }
        /* 亀裂エフェクト */
        .crack {
            position: absolute;
            background: rgba(0,0,0,0.7);
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .crack.visible {
            opacity: 1;
        }
        /* ダストエフェクト */
        .dust {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ccc;
            border-radius: 50%;
            pointer-events: none;
            z-index: 4;
            opacity: 0.7;
        }
        /* 警告ランプ */
        .warning-light {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #333;
            box-shadow: 0 0 10px #000;
            transition: all 0.1s;
        }
        .warning-light.on {
            background: #ff0000;
            box-shadow: 0 0 30px #ff0000, 0 0 60px #ff0000;
            animation: blink 0.3s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        /* 震度表示オーバーレイ */
        .shake-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            background: transparent;
        }
        .status {
            margin-top: 15px;
            font-size: 1rem;
            height: 24px;
            color: #ff9f43;
        }
        /* スマホ対応 */
        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
            .intensity-value { font-size: 2.8rem; }
        }
    </style>
</head>
<body>
    <div class="warning-light" id="warningLight"></div>
    
    <div class="container">
        <h1>🌍 地震シミュレーター</h1>
        <p class="subtitle">【かさまし特盛版】震度を盛ってお届け</p>
        
        <div class="meter">
            <div class="intensity-label">現在の震度（盛り済み）</div>
            <div class="intensity-value" id="intensityValue">0</div>
            <div class="intensity-name" id="intensityName">静穏</div>
        </div>
        
        <div class="presets">
            <button class="preset-btn" data-level="3">震度3</button>
            <button class="preset-btn" data-level="5">震度5強</button>
            <button class="preset-btn" data-level="6">震度6強</button>
            <button class="preset-btn" data-level="7">震度7</button>
        </div>
        
        <div class="buttons">
            <button class="btn-start" id="startBtn">🚨 地震発生！（かさまし）</button>
            <button class="btn-stop" id="stopBtn">🛑 揺れを止める</button>
        </div>
        
        <div class="status" id="status">準備完了。ボタンを押して地震を起こそう</div>
        
        <p class="info">
            ※このシミュレーターは娯楽用です。<br>
            実際の地震では机の下に隠れるなど安全行動を！<br>
            揺れはかなり大げさに盛っています。
        </p>
    </div>
    
    <div class="shake-overlay" id="overlay"></div>

    <script>
        // かさまし係数：実際よりかなり大げさに
        const EXAGGERATION = 2.8;
        
        let isShaking = false;
        let shakeInterval = null;
        let currentIntensity = 0;
        let dustInterval = null;
        
        const intensityNames = {
            0: '静穏',
            1: '微震',
            2: '軽震',
            3: '弱震',
            4: '中震',
            5: '強震',
            6: '烈震',
            7: '激震（かさまし特盛）'
        };
        
        // 震度に応じた揺れの強さ（かさまし済み）
        function getShakeParams(level) {
            // かなり大げさに設定
            const base = {
                1: { amp: 3,  freq: 8,  duration: 2000 },
                2: { amp: 8,  freq: 10, duration: 3000 },
                3: { amp: 18, freq: 12, duration: 4000 },
                4: { amp: 35, freq: 14, duration: 5000 },
                5: { amp: 55, freq: 16, duration: 7000 },
                6: { amp: 90, freq: 18, duration: 9000 },
                7: { amp: 140, freq: 22, duration: 12000 }
            };
            const p = base[level] || base[1];
            return {
                amp: p.amp * EXAGGERATION,
                freq: p.freq,
                duration: p.duration
            };
        }
        
        function updateDisplay(level) {
            document.getElementById('intensityValue').textContent = level;
            document.getElementById('intensityName').textContent = intensityNames[level] || '不明';
            
            const valueEl = document.getElementById('intensityValue');
            if (level >= 6) {
                valueEl.style.color = '#ff0000';
                valueEl.style.textShadow = '0 0 40px #ff0000, 0 0 80px #ff0000';
            } else if (level >= 5) {
                valueEl.style.color = '#ff4757';
                valueEl.style.textShadow = '0 0 30px rgba(255, 71, 87, 0.9)';
            } else if (level >= 4) {
                valueEl.style.color = '#ff9f43';
                valueEl.style.textShadow = '0 0 20px rgba(255, 159, 67, 0.8)';
            } else {
                valueEl.style.color = '#ff4757';
                valueEl.style.textShadow = '0 0 30px rgba(255, 71, 87, 0.9)';
            }
        }
        
        function createCracks(level) {
            // 既存の亀裂を削除
            document.querySelectorAll('.crack').forEach(c => c.remove());
            
            if (level < 5) return;
            
            const count = level >= 7 ? 12 : level >= 6 ? 8 : 4;
            for (let i = 0; i < count; i++) {
                const crack = document.createElement('div');
                crack.className = 'crack';
                const isVertical = Math.random() > 0.5;
                if (isVertical) {
                    crack.style.width = (2 + Math.random() * 4) + 'px';
                    crack.style.height = (80 + Math.random() * 200) + 'px';
                    crack.style.left = Math.random() * 100 + '%';
                    crack.style.top = Math.random() * 60 + '%';
                    crack.style.transform = `rotate(${-15 + Math.random() * 30}deg)`;
                } else {
                    crack.style.height = (2 + Math.random() * 3) + 'px';
                    crack.style.width = (60 + Math.random() * 180) + 'px';
                    crack.style.left = Math.random() * 80 + '%';
                    crack.style.top = Math.random() * 100 + '%';
                    crack.style.transform = `rotate(${-10 + Math.random() * 20}deg)`;
                }
                document.body.appendChild(crack);
                setTimeout(() => crack.classList.add('visible'), 50 + i * 80);
            }
        }
        
        function spawnDust() {
            if (!isShaking) return;
            for (let i = 0; i < 3; i++) {
                const dust = document.createElement('div');
                dust.className = 'dust';
                dust.style.left = Math.random() * 100 + '%';
                dust.style.top = '-10px';
                const size = 4 + Math.random() * 10;
                dust.style.width = size + 'px';
                dust.style.height = size + 'px';
                dust.style.opacity = 0.4 + Math.random() * 0.4;
                document.body.appendChild(dust);
                
                const duration = 800 + Math.random() * 1200;
                const drift = (Math.random() - 0.5) * 100;
                
                dust.animate([
                    { transform: 'translateY(0) translateX(0)', opacity: dust.style.opacity },
                    { transform: `translateY(${window.innerHeight + 50}px) translateX(${drift}px)`, opacity: 0 }
                ], {
                    duration: duration,
                    easing: 'ease-in'
                }).onfinish = () => dust.remove();
            }
        }
        
        function shakeScreen(level) {
            const params = getShakeParams(level);
            const body = document.body;
            const warning = document.getElementById('warningLight');
            const status = document.getElementById('status');
            
            isShaking = true;
            warning.classList.add('on');
            status.textContent = `震度${level} 発生中…（かなり盛ってます）`;
            
            createCracks(level);
            
            // ダスト生成
            if (level >= 4) {
                dustInterval = setInterval(spawnDust, 120);
            }
            
            let startTime = Date.now();
            let frame = 0;
            
            function animate() {
                if (!isShaking) return;
                
                const elapsed = Date.now() - startTime;
                if (elapsed > params.duration) {
                    stopShake();
                    return;
                }
                
                // 減衰
                const progress = elapsed / params.duration;
                const decay = 1 - progress * 0.7; // 最後まで結構揺れる
                
                // 複数の周波数を混ぜてリアルに（でもかさまし）
                const t = elapsed / 1000;
                const x = Math.sin(t * params.freq * 2 * Math.PI) * params.amp * decay
                        + Math.sin(t * params.freq * 1.7 * 2 * Math.PI) * params.amp * 0.4 * decay
                        + (Math.random() - 0.5) * params.amp * 0.3 * decay;
                        
                const y = Math.cos(t * params.freq * 1.3 * 2 * Math.PI) * params.amp * 0.7 * decay
                        + Math.sin(t * params.freq * 2.1 * 2 * Math.PI) * params.amp * 0.3 * decay
                        + (Math.random() - 0.5) * params.amp * 0.25 * decay;
                
                // 回転も少し加える（かさまし）
                const rot = Math.sin(t * params.freq * 0.8 * 2 * Math.PI) * (params.amp / 40) * decay;
                
                body.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
                
                // 震度7は画面も少し赤く
                if (level >= 7) {
                    const flash = Math.sin(t * 15) > 0.7 ? 0.15 : 0;
                    body.style.background = `linear-gradient(180deg, rgba(80,0,0,${flash}) 0%, #1a1a2e 30%, #0f3460 100%)`;
                }
                
                frame++;
                requestAnimationFrame(animate);
            }
            
            requestAnimationFrame(animate);
            
            // バイブレーション（対応端末のみ）
            if (navigator.vibrate) {
                const pattern = [];
                for (let i = 0; i < 20; i++) {
                    pattern.push(50 + level * 10, 30);
                }
                navigator.vibrate(pattern);
            }
        }
        
        function stopShake() {
            isShaking = false;
            document.body.style.transform = 'translate(0,0) rotate(0deg)';
            document.body.style.background = 'linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)';
            document.getElementById('warningLight').classList.remove('on');
            document.getElementById('status').textContent = '揺れが収まりました。また挑戦してね';
            
            if (dustInterval) {
                clearInterval(dustInterval);
                dustInterval = null;
            }
            
            // 亀裂は少し残してから消す
            setTimeout(() => {
                document.querySelectorAll('.crack').forEach(c => {
                    c.style.opacity = '0';
                    setTimeout(() => c.remove(), 400);
                });
            }, 1500);
            
            if (navigator.vibrate) {
                navigator.vibrate(0);
            }
            
            currentIntensity = 0;
            updateDisplay(0);
            
            // プリセットのアクティブ解除
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
        }
        
        // イベント
        document.getElementById('startBtn').addEventListener('click', () => {
            if (isShaking) return;
            // ランダムで震度4〜7をかさましで発生
            const level = Math.floor(Math.random() * 4) + 4; // 4,5,6,7
            currentIntensity = level;
            updateDisplay(level);
            shakeScreen(level);
        });
        
        document.getElementById('stopBtn').addEventListener('click', () => {
            if (isShaking) stopShake();
        });
        
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (isShaking) stopShake();
                
                document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const level = parseInt(btn.dataset.level);
                currentIntensity = level;
                updateDisplay(level);
                shakeScreen(level);
            });
        });
        
        // 初期表示
        updateDisplay(0);
    </script>
</body>
</html>
